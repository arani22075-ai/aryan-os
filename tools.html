<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARYAN OS | ELITE TOOLS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="glass-nav">
        <a href="index.html">CORE</a>
        <a href="ai.html">NEURAL</a>
        <a href="tools.html" class="active">ELITE LAB</a>
        <div class="more-menu" onclick="toggleMenu()">⋮</div>
    </nav>

    <div class="container scrollable">
        <div class="card">
            <div class="card-title">📶 WiFi QR GENERATOR</div>
            <input type="text" id="wifi-name" class="modern-input" placeholder="WiFi Name (SSID)">
            <input type="password" id="wifi-pass" class="modern-input" placeholder="WiFi Password">
            <button class="glow-btn" onclick="genWiFiQR()">GENERATE QR DATA</button>
            <div id="qr-res" class="terminal-mini" style="font-size:10px; margin-top:10px;"></div>
        </div>

        <div class="card">
            <div class="card-title">🛡️ PASSWORD AUDITOR</div>
            <input type="password" id="check-pass" class="modern-input" placeholder="Test a password..." oninput="checkStrength()">
            <div id="strength-meter" style="height:6px; background:#333; margin-top:8px; border-radius:10px; width:0%; transition:0.5s;"></div>
            <div id="strength-text" style="font-size:11px; margin-top:5px; color:var(--main);">RESULT: --</div>
        </div>

        <div class="card">
            <div class="card-title">🔢 DATA TRANSLATOR</div>
            <input type="text" id="data-input" class="modern-input" placeholder="Enter text to convert...">
            <div style="display:flex; gap:10px;">
                <button class="glow-btn" onclick="toBinary()">BINARY</button>
                <button class="glow-btn" onclick="toHex()">HEX</button>
            </div>
            <div id="data-res" class="terminal-mini" style="word-break: break-all; margin-top:10px;"></div>
        </div>
    </div>

    <div id="side-menu" class="side-menu-hidden">
        <h3>ACTION CENTER</h3>
        <button onclick="toggleTheme()">🌓 CHANGE THEME</button>
        <button onclick="showSpecs()">📱 DEVICE SPECS</button>
        <button onclick="checkBreach()">🔍 BREACH CHECK</button>
        <button onclick="toggleFullScreen()">📺 PROJECTOR MODE</button>
        <button onclick="toggleMenu()" style="color:red;">✖ CLOSE</button>
    </div>

    <div id="msg-box" class="hidden"></div>
    <script src="script.js"></script>
</body>
</html>
